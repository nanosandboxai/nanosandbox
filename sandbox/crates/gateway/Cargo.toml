[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent-gateway client for communicating with in-VM gateway processes"

[dependencies]
runtime = { path = "../../../runtime/crates/runtime" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
aes-gcm = "0.11"
rand = { version = "0.10", features = ["thread_rng"] }
base64 = "0.23"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
