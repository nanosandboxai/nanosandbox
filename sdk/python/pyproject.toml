[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosandbox-sdk"
version = "0.2.0"
description = "Python SDK for the nanosandbox protocol helper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DevDone Labs" }]
keywords = ["sandbox", "microvm", "isolation", "sdk", "libkrun"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/nanosandboxai/nanosandbox"
Repository = "https://github.com/nanosandboxai/nanosandbox"
Documentation = "https://github.com/nanosandboxai/nanosandbox/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanosandbox*"]
