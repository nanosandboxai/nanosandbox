[package]
name = "exec-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal in-guest exec agent for nanosandbox (vsock transport)"

[[bin]]
name = "exec-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
