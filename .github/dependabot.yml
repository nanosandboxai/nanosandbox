version: 2
updates:
  # Pinned agent CLI versions (npm-installed agents: claude, codex, gemini,
  # crush, oh-my-openagent, oh-my-codex, oh-my-claude). All 7 must be able to
  # hold open PRs at once; the default open-pull-requests-limit (5) starves the
  # queue once 5+ bumps are in flight, so raise it with headroom.
  - package-ecosystem: npm
    directory: /registries/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Base image + Dockerfile base images (node:22-slim, etc.)
  - package-ecosystem: docker
    directory: /registries/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used across workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
