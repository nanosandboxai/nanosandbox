name: CI

# Build and test checks for every push to main and every PR.
# Releases are handled separately by release.yml on v* tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: bash runtime/scripts/ci/install-deps-apt.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mono-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-mono-cargo-

      - name: Build upstream libkrun
        run: bash runtime/scripts/build-libkrun.sh

      - name: Check CLI + sandbox SDK + runtime
        run: cargo check -p nanosb-cli -p sandbox -p gateway -p runtime

      - name: Unit tests (CLI/TUI)
        run: cargo test -p nanosb-cli

      - name: Unit tests (sandbox SDK + gateway)
        run: cargo test -p sandbox -p gateway

      - name: Unit tests (runtime)
        run: cargo test -p runtime --lib

      - name: Unit tests (protocol)
        run: cargo test -p nanosb-protocol

  host-layer:
    name: Host layer (FFI/TUI-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build nanosb-host
        run: cargo build -p nanosb-host

      - name: Assert nanosb-host is engine/TUI-free
        run: |
          tree="$(cargo tree -p nanosb-host -e normal)"
          if echo "$tree" | grep -qE 'libkrun-sys|ratatui|tui-term|arboard'; then
            echo "::error::nanosb-host must not depend on the VM engine or the TUI"
            echo "$tree" | grep -E 'libkrun-sys|ratatui|tui-term|arboard'
            exit 1
          fi

      - name: Assert slim helper pulls no TUI deps
        run: |
          tree="$(cargo tree -p nanosb-cli --no-default-features --features runtime-host -e normal)"
          if echo "$tree" | grep -qE 'ratatui|tui-term|arboard'; then
            echo "::error::the slim helper (runtime-host) must not pull TUI deps"
            echo "$tree" | grep -E 'ratatui|tui-term|arboard'
            exit 1
          fi

  docs:
    name: Docs accuracy gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs gate on real docs
        run: bash scripts/check-docs.sh

      - name: Assert gate fails on the negative fixture
        run: |
          if bash scripts/check-docs.sh test/check-docs/fixtures; then
            echo "::error::docs gate passed on the negative fixture; it must fail"
            exit 1
          fi
          echo "gate correctly rejected the negative fixture"

      - name: Upload CLI/TUI surface artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-surface
          path: scripts/docs/cli-surface.json

