name: Update models registry

# Refreshes registries/models/models.json from the upstream agent sources and
# opens a PR when something changed. The catalog drives the per-agent
# provider/model compatibility for every code agent.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync models registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync registry from upstream sources
        run: python3 scripts/models/sync.py

      - name: Validate registry
        run: python3 scripts/models/validate.py

      - name: Open PR on change
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(models): refresh agent model catalog"
          title: "chore(models): refresh agent model catalog"
          body: |
            Automated refresh of `registries/models/models.json` (schema v2) from
            the upstream per-agent model sources.

            - Generated by `scripts/models/sync.py` (see `scripts/models/sources/`).
            - Validated by `scripts/models/validate.py`.
            - Regenerates `registries/models/provider-catalog.json`.
            - Updates the per-agent counts table in `registries/README.md`.
          branch: chore/update-models-registry
          delete-branch: true
          add-paths: |
            registries/models/models.json
            registries/models/provider-catalog.json
            registries/README.md
