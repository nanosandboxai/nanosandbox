name: Build Registry Index

on:
  push:
    branches: [main]
    paths:
      - 'agents-registry/agents/**'
      - 'agents-registry/skills/**'
      - 'agents-registry/mcps/**'
      - 'agents-registry/models/**'
      - 'agents-registry/scripts/build-index.py'
      - '.github/workflows/registry-build-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index.json
        working-directory: agents-registry
        run: python3 scripts/build-index.py

      - name: Validate index.json
        run: python3 -m json.tool agents-registry/index.json > /dev/null

      - name: Upload generated index
        uses: actions/upload-artifact@v7
        with:
          name: registry-index
          path: agents-registry/index.json
          retention-days: 30
