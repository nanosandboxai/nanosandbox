name: Release

# Single release pipeline for the whole nanosandbox product.
#
# On a v* tag this builds and publishes ONE GitHub release containing:
#   - nanosb CLI binaries (macOS arm64, Linux x86_64)
#   - CLI install/uninstall scripts + default config
#   - runtime dependencies (libkrunfw + gvproxy) for Linux/macOS
#   - dependency installer scripts (install-deps.sh)
#   - checksums
#
# Architecture: build kernel bundles ONCE, share with all downstream jobs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.3.0). Publishing only happens for tag pushes.'
        required: true

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Job 1: Build kernels once, share with all downstream jobs ───
  build-kernels:
    name: Build kernel bundles (x86_64 + aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache kernel bundles
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          key: kernel-bundles-${{ hashFiles('runtime/deps/libkrunfw/**', 'runtime/scripts/ci/enable-docker-netfilter.py', 'runtime/scripts/ci/check-docker-netfilter-config.py') }}

      - name: Install kernel build dependencies
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git \
            python3 python3-pyelftools \
            bc flex bison libelf-dev cpio libssl-dev xz-utils \
            gcc-aarch64-linux-gnu

      - name: Build x86_64 kernel bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd runtime/deps/libkrunfw
          python3 ../../scripts/ci/enable-docker-netfilter.py --all
          python3 ../../scripts/ci/check-docker-netfilter-config.py --configs "$PWD"
          bash ../../scripts/ci/fetch-kernel-tarball.sh "$PWD"
          make kernel.c -j"$(nproc)"
          python3 ../../scripts/ci/check-docker-netfilter-config.py --built linux-6.12.76/.config
          cp kernel.c ../../../kernel-x86_64.c
          echo "=== x86_64 kernel.c ==="
          ls -lh ../../../kernel-x86_64.c

      - name: Build aarch64 kernel bundle (cross-compile)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd runtime/deps/libkrunfw
          make clean
          python3 ../../scripts/ci/enable-docker-netfilter.py --all
          python3 ../../scripts/ci/check-docker-netfilter-config.py --configs "$PWD"
          bash ../../scripts/ci/fetch-kernel-tarball.sh "$PWD"
          make kernel.c ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          python3 ../../scripts/ci/check-docker-netfilter-config.py --built linux-6.12.76/.config
          cp kernel.c ../../../kernel-aarch64.c
          echo "=== aarch64 kernel.c ==="
          ls -lh ../../../kernel-aarch64.c

      - name: Kernel cache status
        run: |
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Kernel cache HIT — skipped kernel build"
          else
            echo "Kernel cache MISS — built from source"
          fi
          ls -lh kernel-x86_64.c kernel-aarch64.c

      - name: Upload kernel bundles
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bundles
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          retention-days: 7

  # ─── Job 2: Runtime deps — Linux (amd64 + arm64) ───
  build-runtime-linux:
    name: Runtime deps Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-kernels
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            go_arch: amd64
            kernel_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu.2.28
          - arch: arm64
            runner: ubuntu-24.04-arm
            go_arch: arm64
            kernel_arch: aarch64
            rust_target: aarch64-unknown-linux-gnu.2.28
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: bash runtime/scripts/ci/install-deps-apt.sh

      - name: Install cargo-zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      - name: Build libkrunfw from kernel bundle
        run: |
          cd runtime/deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.so.5 ../../../kernel-${{ matrix.kernel_arch }}.c
          ln -sf libkrunfw.so.5 libkrunfw.so
          echo "=== libkrunfw ==="
          ls -lh libkrunfw.so*

      - name: Build upstream libkrun
        run: bash runtime/scripts/build-libkrun.sh

      - name: Build gvproxy
        run: |
          cd runtime/deps/gvproxy
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.go_arch }} \
            GOWORK=off go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      - name: Build runtime (zigbuild)
        run: cargo zigbuild --release -p runtime --target ${{ matrix.rust_target }}

      - name: Package artifacts
        run: |
          mkdir -p dist

          # nanosandbox binary — zigbuild outputs to target/{triple}/release/
          NANOSB="target/${{ matrix.rust_target }}/release/nanosandbox"
          if [ -f "$NANOSB" ]; then
            tar czf "dist/nanosandbox-linux-${{ matrix.arch }}.tar.gz" \
              -C "target/${{ matrix.rust_target }}/release" nanosandbox
          else
            echo "WARNING: nanosandbox binary not found at $NANOSB"
            find target -name nanosandbox -not -path "*/deps/*" | head -5
          fi

          # gvproxy binary (standalone)
          tar czf "dist/gvproxy-linux-${{ matrix.arch }}.tar.gz" \
            -C runtime/deps/gvproxy gvproxy

          # deps bundle: libkrunfw + gvproxy (consumed by install-deps.sh)
          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp runtime/deps/libkrunfw/libkrunfw.so.5 dist/deps-staging/lib/
          ln -sf libkrunfw.so.5 dist/deps-staging/lib/libkrunfw.so
          cp runtime/deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf "dist/deps-linux-${{ matrix.arch }}.tar.gz" -C dist/deps-staging .
          rm -rf dist/deps-staging

          # Checksums
          cd dist && sha256sum ./*.tar.gz > checksums-linux-${{ matrix.arch }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/

  # ─── Job 3: Runtime deps — macOS arm64 ───
  build-runtime-macos:
    name: Runtime deps macOS arm64
    runs-on: macos-latest
    needs: build-kernels
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install macOS build dependencies
        run: |
          brew install lld llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      - name: Build libkrunfw from kernel bundle
        run: |
          cd runtime/deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.5.dylib ../../../kernel-aarch64.c
          ln -sf libkrunfw.5.dylib libkrunfw.dylib
          echo "=== libkrunfw ==="
          ls -lh libkrunfw*.dylib

      - name: Install libkrunfw
        run: |
          sudo mkdir -p /usr/local/lib
          sudo cp runtime/deps/libkrunfw/libkrunfw*.dylib /usr/local/lib/
          ls -la /usr/local/lib/libkrunfw*

      - name: Build upstream libkrun
        run: bash runtime/scripts/build-libkrun.sh

      - name: Build runtime
        run: cargo build --release -p runtime

      - name: Build gvproxy
        run: |
          cd runtime/deps/gvproxy
          GOWORK=off CGO_ENABLED=0 go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      - name: Sign helper binaries (Developer ID, gated)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')"
          codesign --sign "$IDENTITY" --options runtime --timestamp --force runtime/deps/libkrunfw/libkrunfw.5.dylib
          codesign --sign "$IDENTITY" --options runtime --timestamp --force runtime/deps/gvproxy/gvproxy

      - name: Package artifacts
        run: |
          mkdir -p dist

          if [ -f "target/release/nanosandbox" ]; then
            tar czf dist/nanosandbox-darwin-arm64.tar.gz \
              -C target/release nanosandbox
          fi

          tar czf dist/gvproxy-darwin-arm64.tar.gz \
            -C runtime/deps/gvproxy gvproxy

          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp runtime/deps/libkrunfw/libkrunfw.5.dylib dist/deps-staging/lib/
          ln -sf libkrunfw.5.dylib dist/deps-staging/lib/libkrunfw.dylib
          cp runtime/deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf dist/deps-darwin-arm64.tar.gz -C dist/deps-staging .
          rm -rf dist/deps-staging

          cd dist && shasum -a 256 ./*.tar.gz > checksums-darwin-arm64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/

  # ─── Job 4: CLI — Linux x86_64 (glibc floor 2.28) ───
  build-cli-linux:
    name: Build CLI (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-cargo-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libclang-dev \
            python3 python3-pyelftools bc flex bison libelf-dev cpio libssl-dev

      - name: Install cargo-zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version = \".*\"/version = \"${TAG_VERSION}\"/" Cargo.toml
          grep '^version' Cargo.toml | head -1

      - name: Build release binary (glibc floor 2.28)
        run: cargo zigbuild --release -p nanosb-cli --target x86_64-unknown-linux-gnu.2.28

      - name: Verify binary
        run: |
          ls -la target/x86_64-unknown-linux-gnu/release/nanosb
          file target/x86_64-unknown-linux-gnu/release/nanosb
          objdump -T target/x86_64-unknown-linux-gnu/release/nanosb | \
            grep GLIBC | grep -oP 'GLIBC_[0-9.]+' | sort -V | uniq | tail -3

      - name: Stage binary as nanosb-linux-amd64
        run: cp target/x86_64-unknown-linux-gnu/release/nanosb nanosb-linux-amd64

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanosb-linux-amd64
          path: nanosb-linux-amd64
          retention-days: 7

  # ─── Job 6: CLI — macOS arm64 ───
  build-cli-macos:
    name: Build CLI (macOS arm64)
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-cargo-

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i '' "s/^version = \".*\"/version = \"${TAG_VERSION}\"/" Cargo.toml
          grep '^version' Cargo.toml | head -1

      - name: Build release binary
        run: cargo build --release -p nanosb-cli --target aarch64-apple-darwin

      - name: Sign (Developer ID, gated)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')"
          codesign --sign "$IDENTITY" --options runtime --timestamp \
            --entitlements entitlements.plist --force \
            target/aarch64-apple-darwin/release/nanosb
          codesign --verify --verbose=2 target/aarch64-apple-darwin/release/nanosb

      - name: Sign (ad-hoc fallback)
        if: env.HAS_SIGNING != 'true'
        run: |
          codesign --sign - \
            --entitlements entitlements.plist \
            --force \
            target/aarch64-apple-darwin/release/nanosb

      - name: Notarize and staple (gated)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then echo "notarization secrets absent; skipping"; exit 0; fi
          ditto -c -k --keepParent target/aarch64-apple-darwin/release/nanosb "$RUNNER_TEMP/nanosb.zip"
          xcrun notarytool submit "$RUNNER_TEMP/nanosb.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple target/aarch64-apple-darwin/release/nanosb
          spctl -a -vv target/aarch64-apple-darwin/release/nanosb || true

      - name: Verify binary
        run: |
          ls -la target/aarch64-apple-darwin/release/nanosb
          file target/aarch64-apple-darwin/release/nanosb
          target/aarch64-apple-darwin/release/nanosb --version

      - name: Stage binary as nanosb (macOS naming convention)
        run: cp target/aarch64-apple-darwin/release/nanosb nanosb

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanosb-darwin-arm64
          path: nanosb
          retention-days: 7

  # ─── Job 5: Guest exec-agent (aarch64 + x86_64 musl) ───
  # The CLI deploy path requires $NANOSB_HOME/guest-bin/exec-agent; build it for
  # every guest arch (macOS arm64 and Linux arm64 -> aarch64; Linux x86_64 -> x86_64).
  build-exec-agent:
    name: Build exec-agent (musl)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Build exec-agent (aarch64)
        working-directory: guest/crates/exec-agent
        run: |
          rustup target add aarch64-unknown-linux-musl
          RUSTFLAGS="-C linker=rust-lld" cargo build --release --target aarch64-unknown-linux-musl

      - name: Build exec-agent (x86_64)
        working-directory: guest/crates/exec-agent
        run: |
          rustup target add x86_64-unknown-linux-musl
          RUSTFLAGS="-C linker=rust-lld" cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage executables
        run: |
          cp guest/crates/exec-agent/target/aarch64-unknown-linux-musl/release/exec-agent exec-agent-aarch64
          cp guest/crates/exec-agent/target/x86_64-unknown-linux-musl/release/exec-agent exec-agent-x86_64
          file exec-agent-aarch64 exec-agent-x86_64

      - name: Upload exec-agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exec-agent
          path: |
            exec-agent-aarch64
            exec-agent-x86_64
          retention-days: 7

  # ─── Job 5b: Self-contained SDK bundles (macOS arm64) ───
  # Non-blocking: optional per-language bundles assembled from the built runtime.
  build-sdk-bundles:
    name: Build SDK bundles (macOS arm64)
    runs-on: macos-latest
    continue-on-error: true
    needs:
      - build-runtime-macos
      - build-exec-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-darwin-arm64
          path: artifacts/release-darwin-arm64

      - name: Download exec-agent artifact
        uses: actions/download-artifact@v4
        with:
          name: exec-agent
          path: artifacts/exec-agent

      - name: Assemble NANOSB_HOME
        run: |
          H="$RUNNER_TEMP/home/.nanosandbox"
          mkdir -p "$H/bin" "$H/libs" "$H/guest-bin"
          tar xzf artifacts/release-darwin-arm64/gvproxy-darwin-arm64.tar.gz -C "$H/bin"
          tar xzf artifacts/release-darwin-arm64/deps-darwin-arm64.tar.gz -C "$H"
          mv "$H"/lib/libkrunfw*.dylib "$H/libs/" 2>/dev/null || true
          cp artifacts/exec-agent/exec-agent-aarch64 "$H/guest-bin/exec-agent"
          chmod +x "$H/guest-bin/exec-agent" "$H/bin/gvproxy" 2>/dev/null || true
          echo "NANOSB_HOME=$H" >> "$GITHUB_ENV"

      - name: Package SDK bundles
        run: scripts/package-sdk.sh

      - name: Archive bundles
        run: |
          mkdir -p dist-archives
          for d in dist/nanosandbox-sdk-*; do
            tar czf "dist-archives/$(basename "$d").tar.gz" -C dist "$(basename "$d")"
          done
          ls -la dist-archives

      - name: Upload SDK bundles
        uses: actions/upload-artifact@v4
        with:
          name: sdk-bundles
          path: dist-archives/*.tar.gz
          retention-days: 7

  # ─── Job 6: Publish — one GitHub release with everything ───
  publish:
    name: Publish release
    needs:
      - build-runtime-linux
      - build-runtime-macos
      - build-cli-linux
      - build-cli-macos
      - build-exec-agent
      - build-sdk-bundles
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout (for scripts and config)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release

          # CLI binaries
          cp artifacts/nanosb-darwin-arm64/nanosb release/nanosb
          cp artifacts/nanosb-linux-amd64/nanosb-linux-amd64 release/nanosb-linux-amd64

          # CLI install/uninstall scripts + default config
          cp scripts/install.sh release/install.sh
          cp scripts/uninstall.sh release/uninstall.sh
          cp config/agent_defaults.yaml release/agent_defaults.yaml

          # Dependency installer scripts (renamed to avoid clashing with CLI scripts)
          cp install-deps/install.sh release/install-deps.sh
          cp install-deps/uninstall.sh release/uninstall-deps.sh

          # Guest exec-agent (per guest arch)
          if [ -d artifacts/exec-agent ]; then
            cp artifacts/exec-agent/exec-agent-aarch64 release/exec-agent-aarch64
            cp artifacts/exec-agent/exec-agent-x86_64 release/exec-agent-x86_64
            chmod +x release/exec-agent-aarch64 release/exec-agent-x86_64
          fi

          # License text
          cp LICENSE release/LICENSE

          # Self-contained SDK bundles (runtime + SDK sources)
          if [ -d artifacts/sdk-bundles ]; then
            find artifacts/sdk-bundles -type f -name '*.tar.gz' -exec cp {} release/ \;
          fi

          # Runtime deps bundles + standalone runtime/gvproxy archives
          find artifacts/release-linux-amd64 artifacts/release-linux-arm64 artifacts/release-darwin-arm64 \
            -type f \( -name '*.tar.gz' -o -name 'checksums-*.sha256' \) -exec cp {} release/ \;

          chmod +x release/install.sh release/uninstall.sh release/install-deps.sh release/uninstall-deps.sh

          # Final combined checksums
          (cd release && sha256sum ./*.tar.gz ./*.sh > checksums.sha256)

          echo "=== Release files ==="
          ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PRERELEASE_FLAG=""
          if echo "$TAG_NAME" | grep -qE '[-](rc|alpha|beta|dev)'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --title "nanosandbox $TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            release/*
