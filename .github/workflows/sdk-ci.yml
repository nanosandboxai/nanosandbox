name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-drift:
    name: version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/set-sdk-version.sh --check

  build-harness:
    name: build harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nanosb-conformance
      - uses: actions/upload-artifact@v7
        with:
          name: nanosb-conformance
          path: target/debug/nanosb-conformance
          if-no-files-found: error

  rust:
    name: rust
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: cargo test -p nanosb-client -p nanosandbox-sdk
      - name: package (dry run)
        run: cargo package -p nanosb-protocol

  python:
    name: python
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: python -m unittest discover -s sdk/python/tests
      - name: conformance
        run: python sdk/python/conformance/run.py
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
      - name: package (dry run)
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python --outdir dist

  typescript:
    name: typescript
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: node --test "sdk/typescript/tests/*.test.mjs"
      - name: conformance
        run: node sdk/typescript/conformance/run.mjs
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
      - name: package (dry run)
        working-directory: sdk/typescript
        run: npm pack --dry-run

  go:
    name: go
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: go vet ./sdk/go/...
      - run: go test ./sdk/go/...
      - name: conformance
        run: go run ./sdk/go/conformance/run.go
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance

  ruby:
    name: ruby
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: ruby sdk/ruby/test/test_client.rb
      - name: conformance
        run: ruby -I sdk/ruby/lib sdk/ruby/conformance/run.rb
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
      - name: package (dry run)
        working-directory: sdk/ruby
        run: gem build nanosandbox.gemspec

  java:
    name: java
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: mvn -q -B -f sdk/java/pom.xml test
      - name: conformance
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
        run: |
          mvn -q -B -f sdk/java/pom.xml compile
          java -cp sdk/java/target/classes sdk/java/conformance/Run.java
      - name: package (dry run)
        run: mvn -q -B -f sdk/java/pom.xml -DskipTests package

  kotlin:
    name: kotlin
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: sdk/kotlin/gradlew -p sdk/kotlin --no-daemon smokeTest
      - name: conformance
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
        run: sdk/kotlin/gradlew -p sdk/kotlin --no-daemon conformance
      - name: package (dry run)
        run: sdk/kotlin/gradlew -p sdk/kotlin --no-daemon jar

  dotnet:
    name: dotnet
    needs: [build-harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nanosb-conformance
          path: target/debug
      - run: chmod +x target/debug/nanosb-conformance
      - run: dotnet test sdk/dotnet
      - name: conformance
        env:
          NANOSB_CONFORMANCE_BIN: target/debug/nanosb-conformance
        run: dotnet run --project sdk/dotnet/conformance
      - name: package (dry run)
        run: dotnet pack sdk/dotnet/nanosandbox/Nanosandbox.csproj -c Release -o dist
