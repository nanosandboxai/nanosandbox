name: Build and Push Agent Docker Images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'registries/docker/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., rc1, rc2). Required for RC builds.'
        required: false
        type: string
      agent:
        description: 'Specific agent to build (blank = all)'
        required: false
        type: choice
        options:
          - ''
          - claude
          - goose
          - codex
          - cursor
          - opencode
          - aider
          - gemini
          - crush
          - oh-my-openagent
          - oh-my-codex
          - oh-my-claude

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: nanosandboxai/nanosandbox

jobs:
  # ===========================================================================
  # Build shared base image first
  # ===========================================================================
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: registries
          file: registries/docker/Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-v2
          cache-to: type=gha,scope=base-v2,mode=max
          platforms: linux/amd64,linux/arm64

  # ===========================================================================
  # Compute which agents to build (all, or a single one from dispatch input)
  # ===========================================================================
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.set-agents.outputs.agents }}
    steps:
      - name: Determine agent matrix
        id: set-agents
        run: |
          if [ -n "${{ inputs.agent }}" ]; then
            echo 'agents=["${{ inputs.agent }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'agents=["claude","goose","codex","cursor","opencode","aider","gemini","crush","oh-my-openagent","oh-my-codex","oh-my-claude"]' >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # Build per-agent images in parallel (depend on base)
  # ===========================================================================
  build-agent:
    needs: [build-base, setup-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        agent: ${{ fromJSON(needs.setup-matrix.outputs.agents) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve pinned agent versions from package.json
        id: versions
        run: |
          cd registries/docker
          {
            echo "claude=$(node -p "require('./package.json').dependencies['@anthropic-ai/claude-code']")"
            echo "codex=$(node -p "require('./package.json').dependencies['@openai/codex']")"
            echo "gemini=$(node -p "require('./package.json').dependencies['@google/gemini-cli']")"
            echo "crush=$(node -p "require('./package.json').dependencies['@charmland/crush']")"
            echo "omo=$(node -p "require('./package.json').dependencies['omo-ai']")"
            echo "omx=$(node -p "require('./package.json').dependencies['oh-my-codex']")"
            echo "omc=$(node -p "require('./package.json').dependencies['oh-my-claude-sisyphus']")"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push agent image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: registries
          file: registries/docker/Dockerfile.${{ matrix.agent }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base:${{ needs.build-base.outputs.base-tag }}
            CLAUDE_VERSION=${{ steps.versions.outputs.claude }}
            CODEX_VERSION=${{ steps.versions.outputs.codex }}
            GEMINI_VERSION=${{ steps.versions.outputs.gemini }}
            CRUSH_VERSION=${{ steps.versions.outputs.crush }}
            OMO_VERSION=${{ steps.versions.outputs.omo }}
            OMX_VERSION=${{ steps.versions.outputs.omx }}
            OMC_VERSION=${{ steps.versions.outputs.omc }}
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,scope=${{ matrix.agent }},mode=max
          platforms: linux/amd64,linux/arm64

      # Run the just-pushed image *from the registry* (not from the local build
      # cache) to prove the GHCR artifact is actually runnable. Pulls by the
      # pushed manifest digest, so this validates exactly what consumers get.
      - name: Run pushed image from registry
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # The in-image binary name differs from the image repository for a few
          # agents (see registries/README.md).
          bin="${{ matrix.agent }}"
          case "$bin" in
            cursor) bin=cursor-agent ;;
            oh-my-openagent) bin=omo ;;
            oh-my-codex) bin=omx ;;
            oh-my-claude) bin=omc ;;
          esac
          image="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}@${{ steps.build.outputs.digest }}"
          echo "Pulling and running from registry: $image"
          docker pull "$image"
          docker run --rm "$image" "$bin" --version

      - name: Generate build summary
        run: |
          echo "## ${{ matrix.agent }} Agent Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
