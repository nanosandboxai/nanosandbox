# =============================================================================
# E2E Tests Workflow
# =============================================================================
#
# Epic 6 · R4 — real microVM boot/exec/teardown E2E checks.
#
# - macOS (arm64): REQUIRED. Boots a real microVM through the `nanosb-runtime`
#   helper (libkrun/HVF) and runs the ignored live conformance + Epic 5 suites.
# - Linux: allow-failure. GitHub-hosted runners do not expose /dev/kvm, so the
#   job is best-effort until a KVM-capable runner is available.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Build the aarch64 kernel bundle once; the macOS job compiles libkrunfw
  # from it (mirrors release.yml — libkrunfw cannot be built natively on
  # macOS CI because its Makefile requires a krunvm guest).
  # ==========================================================================
  build-kernels:
    name: Build kernel bundle (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache kernel bundle
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: kernel-aarch64.c
          key: kernel-bundle-aarch64-${{ hashFiles('runtime/deps/libkrunfw/**') }}

      - name: Install kernel build dependencies
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git \
            python3 python3-pyelftools \
            bc flex bison libelf-dev cpio libssl-dev xz-utils \
            gcc-aarch64-linux-gnu

      - name: Build aarch64 kernel bundle (cross-compile)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd runtime/deps/libkrunfw
          make kernel.c ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          cp kernel.c ../../../kernel-aarch64.c
          echo "=== aarch64 kernel.c ==="
          ls -lh ../../../kernel-aarch64.c

      - name: Upload kernel bundle
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bundles
          path: kernel-aarch64.c
          retention-days: 7

  # ==========================================================================
  # macOS E2E — REQUIRED. Real microVM boot/exec/teardown via libkrun/HVF.
  # ==========================================================================
  e2e-macos:
    name: Live microVM boot (macOS arm64)
    runs-on: macos-latest
    needs: build-kernels
    # Best-effort: shared macOS runners do not reliably provide the vsock exec
    # channel, so this live job must not block the workflow (mirrors e2e-linux).
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install macOS build dependencies
        run: |
          brew install lld llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      - name: Build libkrunfw from kernel bundle
        run: |
          cd runtime/deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.5.dylib ../../../kernel-aarch64.c
          ln -sf libkrunfw.5.dylib libkrunfw.dylib
          echo "=== libkrunfw ==="
          ls -lh libkrunfw*.dylib

      - name: Install libkrunfw
        run: |
          sudo mkdir -p /usr/local/lib
          sudo cp runtime/deps/libkrunfw/libkrunfw*.dylib /usr/local/lib/
          ls -la /usr/local/lib/libkrunfw*

      - name: Build upstream libkrun
        run: bash runtime/scripts/build-libkrun.sh

      - name: Build gvproxy
        run: |
          mkdir -p "$HOME/.nanosandbox/bin"
          cd runtime/deps/gvproxy
          GOWORK=off CGO_ENABLED=0 go build -o "$HOME/.nanosandbox/bin/gvproxy" ./cmd/gvproxy

      - name: Build nanosb CLI (release)
        run: cargo build --release -p nanosb-cli

      - name: Build nanosb-runtime helper
        run: cargo build --release -p nanosb-cli --bin nanosb-runtime --no-default-features --features runtime-host

      - name: Codesign nanosb-runtime helper
        run: |
          codesign --force --sign - \
            --entitlements runtime/entitlements.plist \
            target/release/nanosb-runtime

      - name: Build and stage exec-agent (aarch64 musl)
        run: |
          rustup target add aarch64-unknown-linux-musl
          ( cd guest/crates/exec-agent && RUSTFLAGS="-C linker=rust-lld" cargo build --release --target aarch64-unknown-linux-musl )
          mkdir -p "$HOME/.nanosandbox/guest-bin"
          cp guest/crates/exec-agent/target/aarch64-unknown-linux-musl/release/exec-agent "$HOME/.nanosandbox/guest-bin/exec-agent"
          chmod +x "$HOME/.nanosandbox/guest-bin/exec-agent"
          file "$HOME/.nanosandbox/guest-bin/exec-agent"

      - name: Live conformance (Epic 1 AC5/AC6/AC9)
        env:
          NANOSB_RUNTIME_BIN: ${{ github.workspace }}/target/release/nanosb-runtime
          NANOSB_TEST_IMAGE: library/alpine:latest
        run: cargo test -p nanosb-client --test live_conformance -- --ignored --nocapture

      - name: Epic 5 live assertions (S1-S9)
        env:
          NANOSB_RUNTIME_BIN: ${{ github.workspace }}/target/release/nanosb-runtime
          NANOSB_TEST_IMAGE: library/alpine:latest
        run: cargo test -p nanosb-client --test epic5_live -- --ignored --nocapture

  # ==========================================================================
  # Linux E2E — allow-failure. GitHub-hosted runners do not expose /dev/kvm,
  # so this job is best-effort: it self-skips when KVM is unavailable and its
  # failure never blocks the workflow. Reuses linux-kvm.yml's approach.
  # ==========================================================================
  e2e-linux:
    name: Live microVM boot (Linux/KVM)
    runs-on: ubuntu-latest
    # GitHub-hosted runners have no /dev/kvm; keep this job non-blocking until
    # a KVM-capable runner is available.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: KVM preflight
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm not present; skipping live E2E"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::warning::/dev/kvm not accessible (user not in 'kvm' group); skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build deps
        if: steps.kvm.outputs.available == 'true'
        run: runtime/scripts/ci/install-deps-apt.sh

      - name: Build runtime dependencies
        if: steps.kvm.outputs.available == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          LIBKRUN_OUTPUT_DIR="$HOME/.nanosandbox/lib" runtime/scripts/build-libkrun.sh
          ( cd runtime/deps/libkrunfw && make )
          sudo cp runtime/deps/libkrunfw/libkrunfw.so.5.* /usr/local/lib/ 2>/dev/null || \
            cp runtime/deps/libkrunfw/libkrunfw.so.5.* "$HOME/.nanosandbox/libs/" 2>/dev/null || true
          sudo ldconfig 2>/dev/null || true
          ( cd runtime/deps/gvproxy && GOWORK=off go build -o "$HOME/.nanosandbox/bin/gvproxy" ./cmd/gvproxy )

      - name: Build nanosb
        if: steps.kvm.outputs.available == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          LIBKRUN_LIB_DIR="$HOME/.nanosandbox/lib" cargo build --release -p nanosb-cli

      - name: Live E2E harness
        if: steps.kvm.outputs.available == 'true'
        run: |
          export PATH="$HOME/.nanosandbox/bin:$HOME/.cargo/bin:$PATH"
          NANOSB_BINARY="$PWD/target/release/nanosb" runtime/scripts/linux-kvm-e2e.sh

      - name: Skipped (no KVM)
        if: steps.kvm.outputs.available != 'true'
        run: |
          echo "Live Linux/KVM E2E skipped: runner has no usable /dev/kvm"
