[workspace]
members = [
    # Nanosandbox runtime (VM engine) and libkrun bindings.
    "runtime/crates/runtime",
    "runtime/crates/libkrun-sys",
    # libkrun internal crates (checked-in source from runtime/deps/libkrun/).
    "runtime/deps/libkrun/src/libkrun",
    "runtime/deps/libkrun/src/vmm",
    "runtime/deps/libkrun/src/devices",
    "runtime/deps/libkrun/src/arch",
    "runtime/deps/libkrun/src/arch_gen",
    "runtime/deps/libkrun/src/kernel",
    "runtime/deps/libkrun/src/polly",
    "runtime/deps/libkrun/src/utils",
    "runtime/deps/libkrun/src/smbios",
    "runtime/deps/libkrun/src/cpuid",
    # Agent-aware sandbox SDK and its gateway client.
    "sandbox/crates/sandbox",
    "sandbox/crates/gateway",
]
resolver = "2"

# Exclude platform-specific crates and submodules that are only needed as
# dependencies on their target OS. Cargo resolves them automatically via
# [target.'cfg(...)'.dependencies] when building on the correct platform.
exclude = [
    "runtime/deps/libkrunfw",
    "runtime/deps/gvproxy",
    "runtime/deps/libkrun/tests",
    "runtime/deps/libkrun/examples",
    "runtime/deps/libkrun/krun-sys",
    "runtime/deps/libkrun/src/krun_display",
    "runtime/deps/libkrun/src/krun_input",
    "runtime/deps/libkrun/src/aws_nitro",
    "runtime/deps/libkrun/src/hvf",
    "runtime/deps/libkrun/src/rutabaga_gfx",
    "runtime/deps/libkrun/src/rutabaga_gfx/ffi",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nanosandboxai/nanosandbox"
authors = ["DevDone Labs"]

[package]
name = "nanosb-cli"
version = "0.2.0"
edition = "2021"
description = "CLI and TUI for nanosandbox"
license = "Apache-2.0"
repository = "https://github.com/nanosandboxai/nanosandbox"
authors = ["DevDone Labs"]

[[bin]]
name = "nanosb"
path = "src/main.rs"

[dependencies]
sandbox = { path = "sandbox/crates/sandbox" }
runtime = { path = "runtime/crates/runtime" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
tabled = "0.15"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# TUI
ratatui = "0.29"
russh = "0.60"
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
vt100 = "0.15"
tui-term = "0.2"
arboard = "3.6"
png = "0.17"

# Utilities
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
unicode-width = "0.2"
async-trait = "0.1"
sha2 = "0.10"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.33", features = ["bundled"] }

# Platform-specific (TUI terminal handling)
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
