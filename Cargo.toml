[workspace]
members = [
    # Nanosandbox runtime (VM engine) and libkrun bindings.
    "runtime/crates/runtime",
    "runtime/crates/runtime-config",
    "runtime/crates/libkrun-sys",
    # Agent-aware sandbox SDK and its gateway client.
    "sandbox/crates/sandbox",
    "sandbox/crates/gateway",
    # Protocol-first SDK substrate: versioned NDJSON protocol + SandboxClient.
    "crates/protocol",
    "crates/client",
    # CI-safe protocol conformance harness for every SDK driver.
    "crates/conformance",
    # Thin host layer (supervisor client/state; no TUI, no FFI).
    "crates/host",
    # Language SDKs.
    "sdk/rust",
]
resolver = "2"

# Exclude platform-specific crates and submodules that are only needed as
# dependencies on their target OS. Cargo resolves them automatically via
# [target.'cfg(...)'.dependencies] when building on the correct platform.
exclude = [
    "runtime/deps/libkrunfw",
    "runtime/deps/gvproxy",
    # Guest-only exec agent: linux/aarch64, cross-compiled separately (its
    # sources are gated to linux, so it must not build for the host).
    "guest/crates/exec-agent",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nanosandboxai/nanosandbox"
authors = ["DevDone Labs"]

[package]
name = "nanosb-cli"
version.workspace = true
edition = "2021"
description = "CLI and TUI for nanosandbox"
license = "Apache-2.0"
repository = "https://github.com/nanosandboxai/nanosandbox"
authors = ["DevDone Labs"]

[[bin]]
name = "nanosb"
path = "src/main.rs"

[[bin]]
name = "nanosb-runtime"
path = "src/bin/nanosb_runtime.rs"

[features]
default = ["tui"]
# Full CLI + interactive TUI (ratatui/tui-term/arboard/png).
tui = ["dep:ratatui", "dep:vt100", "dep:tui-term", "dep:arboard", "dep:png"]
# The slim helper profile (WS1): supervisor + protocol substrate, no TUI deps.
runtime-host = []

[dependencies]
sandbox = { path = "sandbox/crates/sandbox" }
runtime = { path = "runtime/crates/runtime" }
nanosb-protocol = { path = "crates/protocol" }
nanosb-client = { path = "crates/client" }
nanosb-host = { path = "crates/host" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
tabled = "0.22"
colored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# TUI (optional; enabled by the `tui` feature)
ratatui = { version = "0.30", optional = true }
vt100 = { version = "0.16", optional = true }
tui-term = { version = "0.3", optional = true }
arboard = { version = "3.6.1", optional = true }
png = { version = "0.18", optional = true }

# Utilities
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
unicode-width = "0.2"
async-trait = "0.1"
sha2 = "0.11"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }

# Platform-specific (TUI terminal handling)
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
# LTO must stay off: the CLI statically links libkrun.a (a Rust staticlib that
# bundles non-bitcode compiler-rt objects), which fat/thin LTO cannot link.
lto = false
codegen-units = 1
opt-level = "s"
strip = true
