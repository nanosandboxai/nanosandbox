[package]
name = "nanosb-host"
version.workspace = true
edition = "2021"
description = "Thin host layer for nanosandbox: supervisor client + state (no TUI, no FFI)"
license = "Apache-2.0"
repository = "https://github.com/nanosandboxai/nanosandbox"
authors = ["DevDone Labs"]

[lib]
name = "nanosb_host"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nanosb-protocol = { path = "../protocol" }
runtime-config = { path = "../../runtime/crates/runtime-config" }
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
