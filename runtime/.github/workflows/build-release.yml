name: Build Release

# Builds nanosandbox and runtime dependencies for all platforms.
#
# Runtime dependencies packaged as deps-{os}-{arch}.tar.gz:
#   - libkrunfw: Kernel firmware (.so/.dylib) — compiled from kernel.c
#   - gvproxy:   Go networking daemon — built from source
#
# Architecture: Build kernel ONCE, distribute everywhere.
#   1. build-kernels: compiles x86_64 + aarch64 kernel.c on a single Ubuntu runner
#   2. build-linux: downloads kernel.c, builds libkrunfw + gvproxy + nanosandbox per arch
#   3. build-macos: downloads kernel.c, builds libkrunfw + gvproxy + nanosandbox for arm64
#   4. publish: creates GitHub Release, triggers install-deps packaging

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Job 1: Build kernels once, share with all downstream jobs ───
  build-kernels:
    name: Build kernel bundles (x86_64 + aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache kernel bundles
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          key: kernel-bundles-${{ hashFiles('deps/libkrunfw/**') }}

      - name: Install kernel build dependencies
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git \
            python3 python3-pyelftools \
            bc flex bison libelf-dev cpio libssl-dev xz-utils \
            gcc-aarch64-linux-gnu

      - name: Build x86_64 kernel bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd deps/libkrunfw
          make kernel.c -j$(nproc)
          cp kernel.c ../../kernel-x86_64.c
          echo "=== x86_64 kernel.c ==="
          ls -lh ../../kernel-x86_64.c

      - name: Build aarch64 kernel bundle (cross-compile)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd deps/libkrunfw
          make clean
          make kernel.c ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          cp kernel.c ../../kernel-aarch64.c
          echo "=== aarch64 kernel.c ==="
          ls -lh ../../kernel-aarch64.c

      - name: Kernel cache status
        run: |
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Kernel cache HIT — skipped kernel build"
          else
            echo "Kernel cache MISS — built from source"
          fi
          ls -lh kernel-x86_64.c kernel-aarch64.c

      - name: Upload kernel bundles
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bundles
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          retention-days: 7

  # ─── Job 2: Linux builds (amd64 + arm64) ───
  # Uses native runners per architecture to avoid cross-compilation entirely
  # (openssl-sys from oci-distribution doesn't cross-compile cleanly).
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-kernels
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            go_arch: amd64
            kernel_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            go_arch: arm64
            kernel_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: bash scripts/ci/install-deps-apt.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      # Compile kernel.c into libkrunfw shared library (native cc, no cross)
      - name: Build libkrunfw from kernel bundle
        run: |
          cd deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.so.5 ../../kernel-${{ matrix.kernel_arch }}.c
          ln -sf libkrunfw.so.5 libkrunfw.so
          echo "=== libkrunfw ==="
          ls -lh libkrunfw.so*

      - name: Build gvproxy
        run: |
          cd deps/gvproxy
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.go_arch }} \
            go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      # nanosandbox — libkrun compiles in as rlib, no separate .so needed
      - name: Build nanosandbox
        run: cargo build --release -p nanosandbox

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          mkdir -p dist

          # nanosandbox binary
          if [ -f "target/release/nanosandbox" ]; then
            tar czf "dist/nanosandbox-linux-${{ matrix.arch }}.tar.gz" \
              -C "target/release" nanosandbox
          else
            echo "WARNING: nanosandbox binary not found"
          fi

          # gvproxy binary (standalone)
          tar czf "dist/gvproxy-linux-${{ matrix.arch }}.tar.gz" \
            -C deps/gvproxy gvproxy

          # deps bundle: libkrunfw + gvproxy (for install-deps packaging)
          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp deps/libkrunfw/libkrunfw.so.5 dist/deps-staging/lib/
          ln -sf libkrunfw.so.5 dist/deps-staging/lib/libkrunfw.so
          cp deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf "dist/deps-linux-${{ matrix.arch }}.tar.gz" -C dist/deps-staging .
          rm -rf dist/deps-staging

          # Checksums
          cd dist && sha256sum *.tar.gz > checksums-linux-${{ matrix.arch }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/

  # ─── Job 3: macOS build (Apple Silicon) ───
  build-macos:
    name: Build macOS arm64
    runs-on: macos-latest
    needs: build-kernels
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install macOS build dependencies
        run: |
          brew install lld llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      # Compile aarch64 kernel.c into macOS dylib
      - name: Build libkrunfw from kernel bundle
        run: |
          cd deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.5.dylib ../../kernel-aarch64.c
          ln -sf libkrunfw.5.dylib libkrunfw.dylib
          echo "=== libkrunfw ==="
          ls -lh libkrunfw*.dylib

      - name: Install libkrunfw
        run: |
          sudo mkdir -p /usr/local/lib
          sudo cp deps/libkrunfw/libkrunfw*.dylib /usr/local/lib/
          ls -la /usr/local/lib/libkrunfw*

      # nanosandbox — libkrun compiles in as rlib, no separate .dylib needed
      - name: Build nanosandbox
        run: cargo build --release -p nanosandbox

      - name: Build gvproxy
        run: |
          cd deps/gvproxy
          CGO_ENABLED=0 go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      - name: Package artifacts
        run: |
          mkdir -p dist

          # nanosandbox binary
          if [ -f "target/release/nanosandbox" ]; then
            tar czf dist/nanosandbox-darwin-arm64.tar.gz \
              -C target/release nanosandbox
          fi

          # gvproxy binary (standalone)
          tar czf dist/gvproxy-darwin-arm64.tar.gz \
            -C deps/gvproxy gvproxy

          # deps bundle: libkrunfw + gvproxy (for install-deps packaging)
          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp deps/libkrunfw/libkrunfw.5.dylib dist/deps-staging/lib/
          ln -sf libkrunfw.5.dylib dist/deps-staging/lib/libkrunfw.dylib
          cp deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf dist/deps-darwin-arm64.tar.gz -C dist/deps-staging .
          rm -rf dist/deps-staging

          # Checksums
          cd dist && shasum -a 256 *.tar.gz > checksums-darwin-arm64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/

  # ─── Job 4: Publish release and trigger install-deps ───
  publish:
    name: Publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          cd release && sha256sum *.tar.gz > checksums.sha256
          echo "=== Release files ==="
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Trigger install-deps packaging
        env:
          GH_TOKEN: ${{ secrets.INSTALL_DEPS_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -n "$GH_TOKEN" ]; then
            curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/nanosandboxai/install-deps/dispatches \
              -d "{\"event_type\":\"runtime-release\",\"client_payload\":{\"version\":\"$VERSION\"}}"
            echo "Triggered install-deps packaging for $VERSION"
          else
            echo "INSTALL_DEPS_PAT not configured — skipping install-deps trigger"
          fi
