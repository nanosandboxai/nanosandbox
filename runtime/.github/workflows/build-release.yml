name: Build Release

# Builds nanosandbox and runtime dependencies for all platforms.
#
# Runtime dependencies packaged as deps-{os}-{arch}.tar.gz:
#   - libkrunfw: Kernel firmware (.so/.dylib) — compiled from kernel.c
#   - gvproxy:   Go networking daemon — built from source
#
# Architecture: Build kernel ONCE, distribute everywhere.
#   1. build-kernels: compiles x86_64 + aarch64 kernel.c on a single Ubuntu runner
#   2. build-linux: downloads kernel.c, builds libkrunfw + gvproxy + nanosandbox per arch
#   3. build-macos: downloads kernel.c, builds libkrunfw + gvproxy + nanosandbox for arm64
#   4. publish: creates GitHub Release, triggers install-deps packaging

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Job 1: Build kernels once, share with all downstream jobs ───
  build-kernels:
    name: Build kernel bundles (x86_64 + aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache kernel bundles
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          key: kernel-bundles-${{ hashFiles('deps/libkrunfw/**') }}

      - name: Install kernel build dependencies
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git \
            python3 python3-pyelftools \
            bc flex bison libelf-dev cpio libssl-dev xz-utils \
            gcc-aarch64-linux-gnu

      - name: Build x86_64 kernel bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd deps/libkrunfw
          make kernel.c -j$(nproc)
          cp kernel.c ../../kernel-x86_64.c
          echo "=== x86_64 kernel.c ==="
          ls -lh ../../kernel-x86_64.c

      - name: Build aarch64 kernel bundle (cross-compile)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd deps/libkrunfw
          make clean
          make kernel.c ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          cp kernel.c ../../kernel-aarch64.c
          echo "=== aarch64 kernel.c ==="
          ls -lh ../../kernel-aarch64.c

      - name: Kernel cache status
        run: |
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Kernel cache HIT — skipped kernel build"
          else
            echo "Kernel cache MISS — built from source"
          fi
          ls -lh kernel-x86_64.c kernel-aarch64.c

      - name: Upload kernel bundles
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bundles
          path: |
            kernel-x86_64.c
            kernel-aarch64.c
          retention-days: 7

  # ─── Job 2: Linux builds (amd64 + arm64) ───
  # Uses cargo-zigbuild to pin the glibc ABI floor to 2.17, producing a binary
  # that runs on any Linux distro with glibc >= 2.17 (Debian 12, openSUSE, etc.)
  # without the statx/musl incompatibility in libkrun's virtiofs passthrough code.
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-kernels
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            go_arch: amd64
            kernel_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu.2.28
          - arch: arm64
            runner: ubuntu-24.04-arm
            go_arch: arm64
            kernel_arch: aarch64
            rust_target: aarch64-unknown-linux-gnu.2.28
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: bash scripts/ci/install-deps-apt.sh

      - name: Install cargo-zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      # Compile kernel.c into libkrunfw shared library (native cc, no cross)
      - name: Build libkrunfw from kernel bundle
        run: |
          cd deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.so.5 ../../kernel-${{ matrix.kernel_arch }}.c
          ln -sf libkrunfw.so.5 libkrunfw.so
          echo "=== libkrunfw ==="
          ls -lh libkrunfw.so*

      - name: Build gvproxy
        run: |
          cd deps/gvproxy
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.go_arch }} \
            go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      # nanosandbox — glibc binary with floor pinned to 2.17 via zig linker
      - name: Build runtime (zigbuild)
        run: cargo zigbuild --release -p runtime --target ${{ matrix.rust_target }}

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          mkdir -p dist

          # nanosandbox binary — zigbuild outputs to target/{triple}/release/
          # where {triple} uses the full target spec including glibc version suffix
          NANOSB="target/${{ matrix.rust_target }}/release/nanosandbox"
          if [ -f "$NANOSB" ]; then
            tar czf "dist/nanosandbox-linux-${{ matrix.arch }}.tar.gz" \
              -C "target/${{ matrix.rust_target }}/release" nanosandbox
          else
            echo "WARNING: nanosandbox binary not found at $NANOSB"
            find target -name nanosandbox -not -path "*/deps/*" | head -5
          fi

          # gvproxy binary (standalone)
          tar czf "dist/gvproxy-linux-${{ matrix.arch }}.tar.gz" \
            -C deps/gvproxy gvproxy

          # deps bundle: libkrunfw + gvproxy (for install-deps packaging)
          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp deps/libkrunfw/libkrunfw.so.5 dist/deps-staging/lib/
          ln -sf libkrunfw.so.5 dist/deps-staging/lib/libkrunfw.so
          cp deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf "dist/deps-linux-${{ matrix.arch }}.tar.gz" -C dist/deps-staging .
          rm -rf dist/deps-staging

          # Checksums
          cd dist && sha256sum *.tar.gz > checksums-linux-${{ matrix.arch }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/

  # ─── Job 3: macOS build (Apple Silicon) ───
  build-macos:
    name: Build macOS arm64
    runs-on: macos-latest
    needs: build-kernels
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install macOS build dependencies
        run: |
          brew install lld llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      # Compile aarch64 kernel.c into macOS dylib
      - name: Build libkrunfw from kernel bundle
        run: |
          cd deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.5.dylib ../../kernel-aarch64.c
          ln -sf libkrunfw.5.dylib libkrunfw.dylib
          echo "=== libkrunfw ==="
          ls -lh libkrunfw*.dylib

      - name: Install libkrunfw
        run: |
          sudo mkdir -p /usr/local/lib
          sudo cp deps/libkrunfw/libkrunfw*.dylib /usr/local/lib/
          ls -la /usr/local/lib/libkrunfw*

      # nanosandbox — libkrun compiles in as rlib, no separate .dylib needed
      - name: Build runtime
        run: cargo build --release -p runtime

      - name: Build gvproxy
        run: |
          cd deps/gvproxy
          CGO_ENABLED=0 go build -ldflags="-s -w" -o gvproxy ./cmd/gvproxy

      - name: Package artifacts
        run: |
          mkdir -p dist

          # nanosandbox binary
          if [ -f "target/release/nanosandbox" ]; then
            tar czf dist/nanosandbox-darwin-arm64.tar.gz \
              -C target/release nanosandbox
          fi

          # gvproxy binary (standalone)
          tar czf dist/gvproxy-darwin-arm64.tar.gz \
            -C deps/gvproxy gvproxy

          # deps bundle: libkrunfw + gvproxy (for install-deps packaging)
          mkdir -p dist/deps-staging/lib dist/deps-staging/bin
          cp deps/libkrunfw/libkrunfw.5.dylib dist/deps-staging/lib/
          ln -sf libkrunfw.5.dylib dist/deps-staging/lib/libkrunfw.dylib
          cp deps/gvproxy/gvproxy dist/deps-staging/bin/
          tar czf dist/deps-darwin-arm64.tar.gz -C dist/deps-staging .
          rm -rf dist/deps-staging

          # Checksums
          cd dist && shasum -a 256 *.tar.gz > checksums-darwin-arm64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/

  # ─── Job 4a: Prepare Windows-targeted Linux artifacts ───
  # Produces:
  #   - kernel-bundle: vmlinux.bin + guest_addr.txt + entry_addr.txt
  #     (embedded into libkrunfw.dll at compile time on Windows)
  #   - vsock_proxy:   Linux ELF (x86_64-unknown-linux-musl), runs inside guest
  #   - busybox:       Static Linux ELF, sourced from busybox:musl docker image
  # All three end up inside deps-windows-amd64.zip alongside libkrunfw.dll.
  prep-windows-deps:
    name: Prepare Windows deps (kernel + vsock_proxy + busybox)
    runs-on: ubuntu-latest
    needs: build-kernels
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: bash scripts/ci/install-deps-apt.sh

      - name: Install musl tooling
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Download kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .

      - name: Compile libkrunfw.so from kernel.c (x86_64)
        run: |
          cd deps/libkrunfw
          cc -fPIC -DABI_VERSION=5 -shared -o libkrunfw.so.5 ../../kernel-x86_64.c
          ln -sf libkrunfw.so.5 libkrunfw.so
          ls -lh libkrunfw.so*

      - name: Build extract_kernel
        # tools/extract_kernel is in the workspace `exclude` list, so build
        # it standalone from its own directory.
        run: cargo build --release --manifest-path tools/extract_kernel/Cargo.toml

      - name: Extract vmlinux.bin + addr files for libkrunfw-win
        run: |
          mkdir -p windows-prep/kernel-bundle
          ./tools/extract_kernel/target/release/extract_kernel \
            --elf deps/libkrunfw/libkrunfw.so \
            windows-prep/kernel-bundle
          echo "=== Kernel bundle ==="
          ls -lh windows-prep/kernel-bundle/

      - name: Cross-build vsock_proxy + fuse_mount (x86_64-unknown-linux-musl)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release -p hcs --bin vsock_proxy --bin fuse_mount \
            --target x86_64-unknown-linux-musl
          mkdir -p windows-prep/binaries
          cp target/x86_64-unknown-linux-musl/release/vsock_proxy \
             windows-prep/binaries/vsock_proxy
          cp target/x86_64-unknown-linux-musl/release/fuse_mount \
             windows-prep/binaries/fuse_mount
          file windows-prep/binaries/vsock_proxy windows-prep/binaries/fuse_mount
          ls -lh windows-prep/binaries/vsock_proxy windows-prep/binaries/fuse_mount

      - name: Download static busybox (from busybox:musl docker image)
        run: |
          # Pull and extract /bin/busybox from the official static-musl image.
          # This is a stable, well-maintained source for a static Linux ELF.
          docker pull busybox:musl
          cid=$(docker create busybox:musl)
          docker cp "$cid:/bin/busybox" windows-prep/binaries/busybox
          docker rm "$cid"
          chmod +x windows-prep/binaries/busybox
          file windows-prep/binaries/busybox
          ls -lh windows-prep/binaries/busybox

      - name: Upload kernel bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-kernel-bundle
          path: windows-prep/kernel-bundle/
          retention-days: 7

      - name: Upload guest binaries artifact (vsock_proxy + busybox)
        uses: actions/upload-artifact@v4
        with:
          name: windows-guest-binaries
          path: windows-prep/binaries/
          retention-days: 7

  # ─── Job 4b: Windows build (HCS microVM) ───
  # Windows uses libkrun's HCS backend.  libkrunfw-win embeds vmlinux.bin at
  # compile time — we stage the real kernel bundle from prep-windows-deps.
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    needs: prep-windows-deps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Windows kernel bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-kernel-bundle
          path: kernel-bundle

      - name: Stage kernel files for libkrunfw-win
        shell: bash
        run: |
          dest=deps/libkrun/src/libkrunfw-win
          cp kernel-bundle/vmlinux.bin "$dest/vmlinux.bin"
          cp kernel-bundle/guest_addr.txt "$dest/guest_addr.txt"
          cp kernel-bundle/entry_addr.txt "$dest/entry_addr.txt"
          echo "=== Staged kernel ==="
          ls -lh "$dest/vmlinux.bin"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build libkrunfw-win (cdylib with kernel embedded)
        run: cargo build --release -p libkrunfw-win

      - name: Build runtime
        run: cargo build --release -p runtime

      - name: Stage Windows artifacts
        shell: bash
        run: |
          mkdir -p dist
          # libkrunfw.dll — the cdylib's [lib] name in libkrunfw-win/Cargo.toml
          # is `krunfw`, and on Windows cargo doesn't add a `lib` prefix, so the
          # output is target/release/krunfw.dll.  Older toolchain layouts may
          # produce libkrunfw_win.dll or libkrunfw-win.dll — handle all three.
          if [ -f "target/release/krunfw.dll" ]; then
            cp target/release/krunfw.dll dist/libkrunfw.dll
          elif [ -f "target/release/libkrunfw_win.dll" ]; then
            cp target/release/libkrunfw_win.dll dist/libkrunfw.dll
          elif [ -f "target/release/libkrunfw-win.dll" ]; then
            cp target/release/libkrunfw-win.dll dist/libkrunfw.dll
          else
            echo "ERROR: libkrunfw cdylib not found in target/release"
            ls -la target/release | head -40
            exit 1
          fi
          ls -lh dist/libkrunfw.dll
          # nanosandbox library (kept for parity with other platforms)
          if [ -f "target/release/nanosandbox.dll" ] || [ -f "target/release/libruntime.rlib" ]; then
            find target/release -maxdepth 1 -name 'nanosandbox*' -o -name 'libruntime*' | \
              head -5 | tar czf dist/nanosandbox-windows-amd64.tar.gz -T -
          fi

      - name: Upload Windows libkrunfw.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-libkrunfw
          path: dist/libkrunfw.dll
          retention-days: 7

      - name: Upload Windows runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/

  # ─── Job 4c: Package deps-windows-amd64.zip ───
  # Combines libkrunfw.dll (built on Windows) + vsock_proxy + busybox (built on
  # Linux) into the single deps zip consumed by install-deps' install.ps1.
  package-windows-deps:
    name: Package deps-windows-amd64.zip
    runs-on: ubuntu-latest
    needs: [prep-windows-deps, build-windows]
    steps:
      - name: Download libkrunfw.dll
        uses: actions/download-artifact@v4
        with:
          name: windows-libkrunfw
          path: zip-staging

      - name: Download guest binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-guest-binaries
          path: zip-staging

      - name: Verify zip contents
        run: |
          echo "=== Staging contents ==="
          ls -lh zip-staging/
          chmod +x zip-staging/busybox zip-staging/vsock_proxy

      - name: Create deps-windows-amd64.zip
        run: |
          mkdir -p dist
          cd zip-staging
          zip -r ../dist/deps-windows-amd64.zip libkrunfw.dll vsock_proxy fuse_mount busybox
          cd ..
          ls -lh dist/deps-windows-amd64.zip
          unzip -l dist/deps-windows-amd64.zip

      - name: Generate checksum
        run: |
          cd dist
          sha256sum deps-windows-amd64.zip > checksums-windows-amd64.sha256

      - name: Upload deps zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: deps-windows-amd64
          path: dist/

  # ─── Job 5: Publish release and trigger install-deps ───
  publish:
    name: Publish release
    needs: [build-linux, build-macos, build-windows, package-windows-deps]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release
          # Linux/macOS deps tarballs + nanosandbox + gvproxy from build-{linux,macos}
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          # Windows deps zip from package-windows-deps
          find artifacts -type f -name 'deps-windows-amd64.zip' -exec cp {} release/ \;
          (cd release && sha256sum *.tar.gz *.zip > checksums.sha256 2>/dev/null || true)
          echo "=== Release files ==="
          ls -la release/

      - name: Determine prerelease flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qE '[-](rc|alpha|beta|dev)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

      - name: Trigger install-deps packaging
        env:
          GH_TOKEN: ${{ secrets.INSTALL_DEPS_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -n "$GH_TOKEN" ]; then
            curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/nanosandboxai/install-deps/dispatches \
              -d "{\"event_type\":\"runtime-release\",\"client_payload\":{\"version\":\"$VERSION\"}}"
            echo "Triggered install-deps packaging for $VERSION"
          else
            echo "INSTALL_DEPS_PAT not configured — skipping install-deps trigger"
          fi
