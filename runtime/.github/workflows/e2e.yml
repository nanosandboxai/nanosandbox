name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Unit and Integration Tests - Linux
  # ==========================================================================
  unit-tests-linux:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib --features cli

      - name: Run integration tests
        run: cargo test --test integration_test --features cli

      - name: Run Clippy
        run: cargo clippy --features cli -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  # ==========================================================================
  # Unit and Integration Tests - macOS
  # ==========================================================================
  unit-tests-macos:
    name: Unit Tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib --features cli

  # ==========================================================================
  # Unit and Integration Tests - Windows
  # ==========================================================================
  unit-tests-windows:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib --features cli

      - name: Run Windows-specific tests
        run: cargo test --test windows_e2e_test --features cli
        # Note: Some tests may skip if Windows Containers feature is not enabled
        continue-on-error: true

  # ==========================================================================
  # Windows E2E Tests (with Containers feature)
  # ==========================================================================
  windows-e2e-tests:
    name: Windows E2E Tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== System Information ==="
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "Processor: $env:PROCESSOR_IDENTIFIER"
          Write-Host ""

      - name: Check Windows Features
        shell: powershell
        run: |
          Write-Host "=== Windows Features Status ==="
          
          # Check Containers feature
          $containers = Get-WindowsOptionalFeature -Online -FeatureName Containers -ErrorAction SilentlyContinue
          if ($containers.State -eq 'Enabled') {
            Write-Host "[OK] Containers feature: Enabled"
          } else {
            Write-Host "[MISSING] Containers feature: $($containers.State)"
          }
          
          # Check Hyper-V feature
          $hyperv = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -ErrorAction SilentlyContinue
          if ($hyperv.State -eq 'Enabled') {
            Write-Host "[OK] Hyper-V feature: Enabled"
          } else {
            Write-Host "[MISSING] Hyper-V feature: $($hyperv.State)"
          }
          Write-Host ""

      - name: Check Services
        shell: powershell
        run: |
          Write-Host "=== Services Status ==="
          
          # Check HCS service
          $vmcompute = Get-Service vmcompute -ErrorAction SilentlyContinue
          if ($vmcompute) {
            Write-Host "HCS Service (vmcompute): $($vmcompute.Status)"
            if ($vmcompute.Status -ne 'Running') {
              Write-Host "Attempting to start vmcompute service..."
              Start-Service vmcompute -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              $vmcompute = Get-Service vmcompute -ErrorAction SilentlyContinue
              Write-Host "HCS Service status after start attempt: $($vmcompute.Status)"
            }
          } else {
            Write-Host "[MISSING] HCS Service (vmcompute): Not found"
          }
          
          # Check Docker service if present
          $docker = Get-Service docker -ErrorAction SilentlyContinue
          if ($docker) {
            Write-Host "Docker Service: $($docker.Status)"
          }
          Write-Host ""

      - name: Check Container Runtimes
        shell: powershell
        run: |
          Write-Host "=== Container Runtime Binaries ==="
          $binaries = @("runhcs.exe", "ctr.exe", "docker.exe", "containerd.exe", "hcsdiag.exe")
          foreach ($binary in $binaries) {
            $path = Get-Command $binary -ErrorAction SilentlyContinue
            if ($path) {
              Write-Host "[FOUND] $binary : $($path.Source)"
            } else {
              Write-Host "[MISSING] $binary : Not found"
            }
          }
          Write-Host ""

      - name: Build tests
        run: cargo build --test windows_e2e_test --features cli
        continue-on-error: false

      - name: Run Environment Report Test
        id: env_report
        run: cargo test --test windows_e2e_test test_environment_report --features cli -- --nocapture --test-threads=1
        continue-on-error: true

      - name: Run Windows E2E Tests
        id: e2e_tests
        run: cargo test --test windows_e2e_test --features cli -- --nocapture --test-threads=1
        continue-on-error: true

      - name: Test Summary
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  Windows E2E Test Summary"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Environment Report: ${{ steps.env_report.outcome }}"
          Write-Host "E2E Tests: ${{ steps.e2e_tests.outcome }}"
          Write-Host ""
          Write-Host "NOTE: Windows containers can ONLY run Windows images."
          Write-Host "Linux images (Alpine, Ubuntu, etc.) are NOT supported."
          Write-Host ""
          Write-Host "Tests are designed to skip gracefully if prerequisites"
          Write-Host "are not met. Check logs above for [SKIP] messages."
          Write-Host ""
          Write-Host "Required for full tests:"
          Write-Host "  - Windows Containers feature enabled"
          Write-Host "  - HCS service (vmcompute) running"
          Write-Host "  - Container runtime (runhcs.exe) installed"
          Write-Host "========================================"
          Write-Host ""

      - name: Check Test Results
        if: always()
        shell: powershell
        run: |
          # Tests pass if they complete (even with skips)
          # They only fail on actual errors, not missing prerequisites
          if ("${{ steps.e2e_tests.outcome }}" -eq "failure") {
            Write-Host "[WARN] Some tests may have failed. Check logs for details."
            Write-Host "This is expected if Windows Containers are not configured."
          } else {
            Write-Host "[OK] Tests completed successfully."
          }
          # Always exit 0 - Windows container tests are informational
          # The main CI validation happens on Linux
          exit 0

  # ==========================================================================
  # CLI Tests
  # ==========================================================================
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-

      - name: Build CLI
        run: cargo build --features cli

      - name: Run CLI tests
        run: cargo test --test cli_test --features cli

  # ==========================================================================
  # Build Release Artifacts
  # ==========================================================================
  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [unit-tests-linux, unit-tests-macos, unit-tests-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nanosb
            artifact_name: nanosb-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nanosb
            artifact_name: nanosb-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nanosb.exe
            artifact_name: nanosb-windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --features cli --target ${{ matrix.target }}

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -la target/${{ matrix.target }}/release/${{ matrix.artifact }}
          file target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Item target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  # ==========================================================================
  # Summary Job
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [unit-tests-linux, unit-tests-macos, unit-tests-windows, cli-tests, build-release]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.unit-tests-linux.result }}" != "success" ]]; then
            echo "Linux unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests-macos.result }}" != "success" ]]; then
            echo "macOS unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests-windows.result }}" != "success" ]]; then
            echo "Windows unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.cli-tests.result }}" != "success" ]]; then
            echo "CLI tests failed"
            exit 1
          fi
          if [[ "${{ needs.build-release.result }}" != "success" ]]; then
            echo "Release build failed"
            exit 1
          fi
          echo "All CI jobs passed!"
