name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Unit and Integration Tests (no external dependencies)
  # ==========================================================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --features cli

      - name: Run Clippy
        run: cargo clippy --features cli -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  # ==========================================================================
  # All Tests (including E2E - requires network)
  # ==========================================================================
  # Note: All tests now run together. E2E tests require network access.
  # Sandbox creation test gracefully handles missing runtime.

  # ==========================================================================
  # Build Release Artifacts
  # ==========================================================================
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    needs: [unit-tests, network-e2e-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nanosb
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nanosb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --features cli --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanosb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
