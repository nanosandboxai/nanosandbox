name: CI

# Lint, format check, and unit tests for the Rust workspace.
# Runs on macOS (has HVF). Integration tests that boot VMs are #[ignore]
# and skipped by default — only unit tests run here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy -p nanosandbox -p libkrun-sys -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      # Unit tests only — integration tests need KVM and are #[ignore]
      - name: Unit tests
        run: cargo test -p nanosandbox -p libkrun-sys
