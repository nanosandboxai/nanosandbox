[package]
name = "devices"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2021"
build = "build.rs"

[features]
tee = []
amd-sev = ["blk", "tee"]
tdx = ["blk", "tee"]
net = []
blk = ["imago"]
efi = ["blk", "net"]
gpu = ["rutabaga_gfx", "thiserror", "zerocopy", "krun_display"]
snd = ["pw", "thiserror"]
input = ["zerocopy", "krun_input"]
virgl_resource_map2 = []
aws-nitro = []
test_utils = []

[dependencies]
bitflags = "1.2.0"
crossbeam-channel = ">=0.5.15"
libloading = "0.8"
log = "0.4.0"
rand = "0.9.2"
thiserror = { version = "2.0", optional = true }
virtio-bindings = "0.2.0"
vm-memory = { version = "=0.16.2", features = ["backend-mmap"] }
zerocopy = { version = "0.8.26", optional = true, features = ["derive"] }
krun_input = { path = "../krun_input", features = ["bindgen_clang_runtime"], optional = true }

arch = { path = "../arch" }
utils = { path = "../utils" }
polly = { path = "../polly" }
imago = { version = "0.2.1", features = ["sync-wrappers", "vm-memory"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = ">=0.2.39"
nix = { version = "0.30.1", features = ["ioctl", "net", "poll", "socket", "fs"] }
pw = { package = "pipewire", version = "0.8.0", optional = true }
krun_display = { path = "../krun_display", optional = true, features = ["bindgen_clang_runtime"] }
rutabaga_gfx = { path = "../rutabaga_gfx", features = ["virgl_renderer", "virgl_renderer_next"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Hypervisor",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { path = "../hvf" }
lru = ">=0.9"

[target.'cfg(target_os = "linux")'.dependencies]
rutabaga_gfx = { path = "../rutabaga_gfx", features = ["x"], optional = true }
caps = "0.5.5"
kvm-bindings = { version = ">=0.11", features = ["fam-wrappers"] }
kvm-ioctls = ">=0.21"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
vm-fdt = ">= 0.2.0"
