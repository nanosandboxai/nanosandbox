[package]
name = "hcs"
version = "0.1.0"
authors = ["The libkrun-win Authors"]
edition = "2021"
description = "Rust wrappers for the Windows Host Compute Service (HCS) API"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_HostComputeSystem",
    "Win32_System_Pipes",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Vhd",
    "Win32_System_IO",
] }
serde_json = "1.0"

[[bin]]
name = "plan9_mount"
path = "src/plan9_mount.rs"

[[bin]]
name = "vsock_proxy"
path = "src/vsock_proxy.rs"

[dependencies]
log = "0.4"
flate2 = "1.0"
