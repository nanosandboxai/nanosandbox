[package]
name = "libkrun"
version = "1.17.3"
authors = ["The libkrun Authors"]
edition = "2021"
build = "build.rs"

[features]
tee = ["vmm/tee", "devices/tee"]
amd-sev = [ "blk", "tee", "vmm/amd-sev", "devices/amd-sev" ]
tdx = [ "blk", "tee", "vmm/tdx", "devices/tdx" ]
net = ["vmm/net", "devices/net"]
blk = ["vmm/blk", "devices/blk"]
efi = [ "blk", "net", "vmm/efi", "devices/efi" ]
gpu = ["krun_display", "vmm/gpu", "devices/gpu"]
snd = ["vmm/snd", "devices/snd"]
input = ["krun_input", "vmm/input", "devices/input"]
virgl_resource_map2 = []
aws-nitro = [ "dep:aws-nitro", "dep:nitro-enclaves", "vmm/aws-nitro", "devices/aws-nitro" ]
hcs = ["vmm/hcs"]

[dependencies]
crossbeam-channel = ">=0.5.15"
env_logger = "0.11"
libc = ">=0.2.39"
libloading = "0.8"
log = "0.4.0"
once_cell = "1.4.1"
vm-memory = { version = "=0.16.2", features = ["backend-mmap"] }
krun_input = { path = "../krun_input", optional = true, features = ["bindgen_clang_runtime"] }

devices = { path = "../devices" }
polly = { path = "../polly" }
utils = { path = "../utils" }
vmm = { path = "../vmm" }
rand = "0.9.2"

[target.'cfg(unix)'.dependencies]
krun_display = { path = "../krun_display", optional = true, features = ["bindgen_clang_runtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { path = "../hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = ">=0.11", features = ["fam-wrappers"] }
kvm-ioctls = ">=0.21"
aws-nitro = { path = "../aws_nitro", optional = true }
nitro-enclaves = { version = "0.5.0", optional = true }

[lib]
name = "krun"
crate-type = ["rlib"]
