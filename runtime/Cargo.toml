[package]
name = "nanosandbox"
version = "0.1.0"
edition = "2021"
description = "VM-based sandbox SDK using libkrun and crun"
license = "Apache-2.0"
repository = "https://github.com/devdone-labs/dd-nanosandbox"
keywords = ["sandbox", "virtualization", "containers", "isolation", "security"]
categories = ["development-tools", "virtualization"]
authors = ["DevDone Labs"]

[lib]
name = "nanosandbox"
path = "src/lib.rs"

[[bin]]
name = "nano"
path = "src/bin/nano.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap"]
server = ["axum", "tower"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OCI/Container support
# oci-distribution = "0.11"  # For registry operations
# tar = "0.4"                 # For layer extraction

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
dirs = "6"

# CLI (optional)
clap = { version = "4", features = ["derive"], optional = true }

# Server (optional)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
