[package]
name = "nanosandbox"
version = "0.1.0"
edition = "2021"
description = "VM-based sandbox SDK using libkrun FFI"
license = "Apache-2.0"
repository = "https://github.com/devdone-labs/dd-nanosandbox"
keywords = ["sandbox", "virtualization", "containers", "isolation", "security"]
categories = ["development-tools", "virtualization"]
authors = ["DevDone Labs"]

[lib]
name = "nanosandbox"
path = "src/lib.rs"

[[bin]]
name = "nanosb"
path = "src/bin/nanosb.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap", "indicatif", "tabled", "colored", "tracing-subscriber", "ratatui", "russh", "ssh-key", "vt100", "tui-term"]
server = ["axum", "tower"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# OCI/Container support
oci-distribution = "0.11"   # For registry operations
tar = "0.4"                 # For layer extraction
flate2 = "1"                # For gzip decompression
sha2 = "0.10"               # For blob integrity verification
docker_credential = "1.3"   # For Docker config.json parsing

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
log = "0.4"         # Needed to detect existing logger for libkrun FFI safety
env_logger = "0.11" # Needed to safely probe before krun_set_log_level calls env_logger::init()
async-trait = "0.1"
dirs = "6"
unicode-width = "0.2"

# libkrun FFI support - fork child process for krun_start_enter (macOS + Linux)
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
libloading = "0.8"

# CLI (optional)
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }  # Progress bars
tabled = { version = "0.15", optional = true }     # Table formatting
colored = { version = "2", optional = true }       # Colored output
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
ratatui = { version = "0.29", optional = true }    # Terminal UI
russh = { version = "0.57", optional = true }      # Async SSH2 client
ssh-key = { version = "0.6", features = ["ed25519", "std"], optional = true } # SSH key loading
vt100 = { version = "0.15", optional = true }      # Terminal emulation
tui-term = { version = "0.2", optional = true }    # ratatui terminal widget

# Server (optional)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

# Windows containerd gRPC client
[target.'cfg(windows)'.dependencies]
containerd-client = "0.8"
prost-types = "0.13"
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"    # CLI testing
predicates = "3"    # Output assertions

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
