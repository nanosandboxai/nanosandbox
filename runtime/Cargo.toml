[workspace]
members = [
    "crates/nanosandbox",
    "crates/libkrun-sys",
]
resolver = "2"

# Exclude submodule workspaces — they have their own Cargo.toml
exclude = [
    "deps/libkrun",
    "deps/libkrunfw",
    "deps/gvproxy",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
