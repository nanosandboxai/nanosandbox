[package]
name = "nanosandbox"
version = "0.1.0"
edition = "2021"
description = "VM-based sandbox SDK using libkrun and crun"
license = "Apache-2.0"
repository = "https://github.com/devdone-labs/dd-nanosandbox"
keywords = ["sandbox", "virtualization", "containers", "isolation", "security"]
categories = ["development-tools", "virtualization"]
authors = ["DevDone Labs"]

[lib]
name = "nanosandbox"
path = "src/lib.rs"

[[bin]]
name = "nanosb"
path = "src/bin/nanosb.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap", "indicatif", "tabled", "colored", "tracing-subscriber"]
server = ["axum", "tower"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OCI/Container support
oci-distribution = "0.11"   # For registry operations
tar = "0.4"                 # For layer extraction
flate2 = "1"                # For gzip decompression
docker_credential = "1.3"   # For Docker config.json parsing

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
dirs = "6"

# CLI (optional)
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }  # Progress bars
tabled = { version = "0.15", optional = true }     # Table formatting
colored = { version = "2", optional = true }       # Colored output
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# Server (optional)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"    # CLI testing
predicates = "3"    # Output assertions

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
