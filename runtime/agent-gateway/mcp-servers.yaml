version: "1"

defaults:
  timeout_sec: 30
  startup_timeout_sec: 10

servers:
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
    enabled: true

  fetch:
    command: "uvx"
    args: ["mcp-server-fetch"]
    enabled: false

  filesystem:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
    enabled: true

  memory:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-memory", "--directory", "/root/.memory"]
    enabled: true

  brave-search:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    enabled: false

  context7:
    command: "npx"
    args: ["-y", "@upstash/context7-mcp"]
    enabled: true

agents:
  claude:
    config_path: "/root/.mcp.json"
    format: "claude"
    exclude: [filesystem]

  goose:
    config_path: "/root/.config/goose/config.yaml"
    format: "goose"
    exclude: []

  codex:
    config_path: "/root/.codex/config.toml"
    format: "codex"
    exclude: []

  cursor:
    config_path: "/root/.cursor/mcp.json"
    format: "cursor"
    exclude: [filesystem]
