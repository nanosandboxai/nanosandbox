# Provider normalization map for the models registry (v2).
#
# `canonical`: variant prefix -> canonical provider id. The first `/`-segment of
#   a prefixed model string is lowercased, stripped of any `:*` suffix, and
#   looked up here. Identity entries (variant == canonical) are required for
#   every prefix actually used in the catalog so validation accepts them.
# `env`: canonical provider id -> env var key, list of env var keys, or `[]`
#   sentinel for providers that authenticate via OAuth / no env var.
#
# Source of truth: this file. `scripts/models/providers.py` embeds the same
#   maps as a fallback for environments without a working PyYAML and verifies
#   they stay in sync (see test_providers.py).

