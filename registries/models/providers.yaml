# Per-agent provider resolution rules (compiled into provider-catalog.json).
# `mode`:
#   single   -> one credential regardless of the model (default + alt keys)
#   collapse -> the first model segment maps to a credential provider
#               (case-sensitive when case_sensitive: true); `collapse_default`
#               catches every other segment
#   derived  -> the credential provider is the model's canonical prefix
# `overrides` are keyed by raw variant (or canonical id) and win over `env`.
# `no_env` providers authenticate via OAuth/browser (no env var). `extra_keys`
# are accepted-key floors preserved for backward compatibility.
agents:
  claude:
    mode: single
    default: anthropic
    alt: [CLAUDE_CODE_OAUTH_TOKEN]
    providers: [anthropic]
  codex:
    mode: single
    default: openai
    alt: [CODEX_API_KEY]
    providers: [openai]
  goose:
    mode: collapse
    case_sensitive: true
    collapse: {anthropic: anthropic, openai: openai, google: google, gemini: google, openrouter: openrouter}
    collapse_default: openrouter
    providers: [anthropic, openai, google, openrouter]
  cursor:
    mode: single
    default: cursor
    providers: []
  opencode:
    mode: derived
    overrides:
      bakeryhub: {keys: [BAKERYHUB_API_KEY]}
    extra_keys: [GOOGLE_API_KEY]
  aider:
    mode: derived
    overrides:
      azure: {keys: [AZURE_API_KEY]}
  gemini:
    mode: single
    default: gemini
    alt: [GOOGLE_API_KEY]
    providers: [gemini]
  crush:
    mode: derived
    overrides:
      azure: {keys: [AZURE_OPENAI_API_KEY]}
    no_env: [copilot]
    extra_keys: [GOOGLE_API_KEY]
  oh-my-openagent:
    mode: derived
    no_env: [copilot, chatgpt_subscription]
  oh-my-codex:
    mode: single
    default: openai
    alt: [CODEX_API_KEY]
    providers: [openai]
  oh-my-claude:
    mode: single
    default: anthropic
    alt: [CLAUDE_CODE_OAUTH_TOKEN]
    providers: [anthropic]
