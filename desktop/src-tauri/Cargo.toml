[package]
name = "nanosb-desktop"
version = "0.1.0"
edition = "2021"
description = "nanosb desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
command-core = { path = "../../crates/command-core" }
pane-core = { path = "../../crates/pane-core" }
terminal-core = { path = "../../crates/terminal-core" }
upload-core = { path = "../../crates/upload-core" }
sandbox = { path = "../../../sandbox/crates/sandbox" }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
serde_json = "1"

[workspace]
